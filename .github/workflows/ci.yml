name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-central-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  patches-guard:
    runs-on: ubuntu-latest
    name: Patches listed
    steps:
      - uses: actions/checkout@v6
      - name: Every patch module is in patches.txt
        run: python3 scripts/check_patches.py

  changes:
    runs-on: ubuntu-latest
    name: Test groups
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Pick the test groups this change needs
        id: groups
        run: |
          # Billing tests never run these modules. A link from billing to one of them makes billing run anyway.
          skippable='investigator|www|oidc|support|geo'
          unrelated="^(dashboard|docs|e2e|llm|\.claude)/|\.md\$|^central/($skippable)(/|\.py\$)"
          if [ "${{ github.event_name }}" = pull_request ] \
            && ! git grep -qE "central[./]($skippable)([^a-z_]|$)" -- central/billing \
            && ! git diff --name-only HEAD^1 HEAD | grep -qvE "$unrelated"; then
            echo 'groups=["core"]' >> "$GITHUB_OUTPUT"
          else
            echo 'groups=["core", "billing"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    name: Server tests (${{ matrix.group }})

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app central $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app central
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          cd sites && ../env/bin/python ../apps/central/scripts/run_test_group.py test_site ${{ matrix.group }}
        env:
          TYPE: server

  server:
    runs-on: ubuntu-latest
    name: Server
    needs: tests
    if: always()
    steps:
      - name: Every server test build passed
        run: test "${{ needs.tests.result }}" = "success"
