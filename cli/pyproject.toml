[project]
name = "central-cli"
version = "0.1.0"
description = "Command line interface for Frappe Cloud Central"
authors = [{ name = "frappe", email = "developers@frappe.io" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # X25519 key pairs for WireGuard devices. The private key never leaves the machine.
    "cryptography>=42",
]

[project.scripts]
central = "central_cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "central_cli"

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
