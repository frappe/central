[project]
name = "fcloud"
version = "0.1.0"
description = "Command line client for Frappe Cloud."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.6",
    "httpx2>=2.16",
    "keyring>=25.6",
    "rich>=14.0",
    "typer>=0.16",
]

[project.scripts]
fcloud = "fcloud.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-httpx2>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcloud"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["httpx2(**options): configure the httpx2_mock router, for example assert_all_called=False."]
