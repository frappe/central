<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Server controls test</title></head>
<body><div id="app"></div><script type="module">
import { createApp } from 'vue'
import { createRouter, createWebHistory } from 'vue-router'
import { FrappeUI } from 'frappe-ui'
import ServerControls from './ServerControls.vue'
import { __ } from '../src/lib/translate'
import '../src/style.css'
const router = createRouter({history: createWebHistory(), routes: [{path: '/:pathMatch(.*)*', component: ServerControls}]})
const app = createApp(ServerControls).use(router).use(FrappeUI)
app.config.globalProperties.__ = __
app.mount('#app')
</script></body>
</html>
