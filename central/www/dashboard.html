{% extends "templates/web.html" %}

{% block page_content %}

{% block script %}
{% if not dev_server %}
{% for path in css_files %}

{% for path in js_files %}
<script type="module" src="{{ path }}"></script>
{% endfor %}
{% endif %}
{% endblock %}
